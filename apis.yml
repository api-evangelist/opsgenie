aid: opsgenie
name: OpsGenie
description: OpsGenie is an incident management and alerting platform, now part of
  Atlassian, that helps operations teams manage on-call schedules, route alerts, and
  coordinate incident response. The OpsGenie developer platform provides a comprehensive
  set of REST APIs for programmatically managing alerts, incidents, teams, schedules,
  escalations, integrations, heartbeats, services, notification rules, accounts, and
  maintenance windows.
kind: contract
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consuming
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/opsgenie.png
tags:
- Alerts
- Incident Management
- Monitoring
- On-Call
- Operations
