"""
OpsGenie (Atlassian) GraphQL Schema
Conceptual schema derived from the OpsGenie REST API.
Source: https://docs.opsgenie.com/docs/api-overview
Provider: OpsGenie (Atlassian)
Base URL: https://api.opsgenie.com
"""

# ─────────────────────────────────────────────
# Scalars
# ─────────────────────────────────────────────

scalar DateTime
scalar JSON

# ─────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────

"""Priority level for an alert."""
enum AlertPriority {
  P1
  P2
  P3
  P4
  P5
}

"""Lifecycle status of an alert."""
enum AlertStatus {
  OPEN
  ACKED
  CLOSED
}

"""Lifecycle status of an incident."""
enum IncidentStatus {
  OPEN
  RESOLVED
  CLOSED
}

"""Type of a schedule rotation."""
enum RotationType {
  DAILY
  WEEKLY
  HOURLY
}

"""Role of a user within OpsGenie."""
enum UserRole {
  ADMIN
  USER
  READ_ONLY
  OBSERVER
  STAKEHOLDER
}

"""Type of a team member role."""
enum TeamMemberRole {
  ADMIN
  USER
}

"""Type of contact method for notifications."""
enum ContactMethodType {
  EMAIL
  SMS
  VOICE
  MOBILE
}

"""Notification condition operator."""
enum ConditionOperator {
  MATCHES
  DOES_NOT_MATCH
  CONTAINS
  DOES_NOT_CONTAIN
  STARTS_WITH
  ENDS_WITH
  EQUALS
  NOT_EQUALS
  GREATER_THAN
  LESS_THAN
}

"""Field targeted by a notification condition."""
enum ConditionField {
  MESSAGE
  ALIAS
  DESCRIPTION
  SOURCE
  ENTITY
  TAGS
  PRIORITY
  EXTRA_PROPERTIES
  RESPONDERS
  TEAMS
}

"""Status of a heartbeat monitor."""
enum HeartbeatStatus {
  ACTIVE
  EXPIRED
}

"""Type of responder assigned to an alert or incident."""
enum ResponderType {
  TEAM
  USER
  ESCALATION
  SCHEDULE
}

"""Status of an integration."""
enum IntegrationStatus {
  ENABLED
  DISABLED
}

"""Type of maintenance window rule entity."""
enum MaintenanceEntityType {
  INTEGRATION
  POLICY
}

"""Status of a maintenance window."""
enum MaintenanceStatus {
  ACTIVE
  INACTIVE
  PLANNED
  CANCELLED
}

# ─────────────────────────────────────────────
# Alert Types
# ─────────────────────────────────────────────

"""A top-level alert within OpsGenie."""
type Alert {
  id: ID!
  tinyId: String
  alias: String
  message: String!
  status: AlertStatus!
  acknowledged: Boolean!
  isSeen: Boolean!
  tags: [AlertTag!]
  snoozed: Boolean!
  snoozedUntil: DateTime
  count: Int!
  lastOccurredAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  source: String
  owner: String
  priority: AlertPriority!
  responders: [AlertResponder!]
  integration: AlertIntegrationRef
  report: AlertReport
  details: AlertDetails
}

"""Extended metadata and payload for an alert."""
type AlertDetails {
  alertId: ID!
  message: String!
  alias: String
  description: String
  responders: [AlertResponder!]
  visibleTo: [AlertResponder!]
  actions: [String!]
  tags: [AlertTag!]
  details: JSON
  entity: String
  source: String
  priority: AlertPriority!
  user: String
  note: String
  notes: [AlertNote!]
  createdAt: DateTime!
  updatedAt: DateTime!
  status: AlertStatus!
  acknowledged: Boolean!
  snoozed: Boolean!
  snoozedUntil: DateTime
  count: Int!
  teams: [TeamRef!]
  integration: AlertIntegrationRef
  report: AlertReport
  owner: String
}

"""A responder (team or user) assigned to an alert."""
type AlertResponder {
  id: ID!
  type: ResponderType!
  name: String
}

"""A tag string applied to an alert."""
type AlertTag {
  value: String!
}

"""A note added to an alert."""
type AlertNote {
  id: ID!
  alertId: ID!
  note: String!
  owner: String!
  createdAt: DateTime!
  offset: String
}

"""Record of an alert acknowledgment."""
type AlertAck {
  alertId: ID!
  acknowledgedBy: String!
  acknowledgedAt: DateTime!
}

"""Record of an alert being closed."""
type AlertClose {
  alertId: ID!
  closedBy: String!
  closedAt: DateTime!
}

"""Record of an alert being snoozed."""
type AlertSnooze {
  alertId: ID!
  snoozedBy: String!
  snoozedUntil: DateTime!
}

"""A user action taken on an alert."""
type AlertAction {
  alertId: ID!
  action: String!
  performedBy: String!
  performedAt: DateTime!
}

"""Reference to the integration that sourced an alert."""
type AlertIntegrationRef {
  id: ID!
  name: String!
  type: String!
}

"""Reporting metadata for an alert."""
type AlertReport {
  ackTime: Int
  closeTime: Int
  acknowledgedBy: String
  closedBy: String
}

"""A reference to an alert source."""
type AlertSource {
  name: String!
  type: String!
}

"""Payload returned by alert count queries."""
type AlertCountPayload {
  count: Int!
}

