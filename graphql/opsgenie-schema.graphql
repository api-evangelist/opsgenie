# ─────────────────────────────────────────────
# Response Types
# ─────────────────────────────────────────────

"""Standard asynchronous request result."""
type RequestResult {
  result: String!
  took: Float!
  requestId: String!
}

# ─────────────────────────────────────────────
# Root Query
# ─────────────────────────────────────────────

type Query {
  """Fetch a single alert by its ID."""
  alert(id: ID!): AlertDetails

  """List alerts with optional filtering."""
  alerts(
    query: String
    searchIdentifier: String
    searchIdentifierType: String
    offset: Int
    limit: Int
    sort: String
    order: String
  ): AlertConnection!

  """Count alerts matching the given query."""
  alertCount(query: String): AlertCountPayload!

  """Fetch a single incident by ID."""
  incident(id: ID!): IncidentDetails

  """List incidents with optional filtering."""
  incidents(
    query: String
    offset: Int
    limit: Int
    sort: String
    order: String
  ): IncidentConnection!

  """Fetch a schedule by its ID or name."""
  schedule(id: ID!): ScheduleDetails

  """List all schedules."""
  schedules(limit: Int, offset: Int, expand: Boolean): ScheduleConnection!

  """Return current on-call participants for a schedule."""
  whoIsOnCall(scheduleId: ID!, flat: Boolean): OnCall!

  """Fetch an escalation policy by ID."""
  escalation(id: ID!): EscalationPolicy

  """List all escalation policies."""
  escalations(limit: Int, offset: Int): EscalationConnection!

  """Fetch a team by ID."""
  team(id: ID!): TeamDetails

  """List all teams."""
  teams(limit: Int, offset: Int): TeamConnection!

  """Fetch a user by their ID or username."""
  user(id: ID!): UserDetails

  """List all users."""
  users(limit: Int, offset: Int, sort: String, order: String): UserConnection!

  """Fetch a service by ID."""
  service(id: ID!): ServiceDetails

  """List all services."""
  services(limit: Int, offset: Int, teamId: ID): ServiceConnection!

  """Fetch a heartbeat monitor by name."""
  heartbeat(name: String!): HeartbeatDetails

  """List all heartbeat monitors."""
  heartbeats(limit: Int, offset: Int): HeartbeatConnection!

  """Fetch an integration by ID."""
  integration(id: ID!): IntegrationDetails

  """List all integrations."""
  integrations(
    type: String
    teamId: ID
    limit: Int
    offset: Int
  ): IntegrationConnection!

  """Fetch a maintenance window by ID."""
  maintenanceWindow(id: ID!): MaintenanceWindow

  """List maintenance windows."""
  maintenanceWindows(
    type: String
    limit: Int
    offset: Int
  ): MaintenanceConnection!

  """Retrieve the current account details."""
  account: Account!
}

# ─────────────────────────────────────────────
# Root Mutation
# ─────────────────────────────────────────────

type Mutation {
  """Create a new alert."""
  createAlert(input: CreateAlertInput!): RequestResult!

  """Close an alert by ID."""
  closeAlert(id: ID!, user: String, source: String, note: String): RequestResult!

  """Acknowledge an alert by ID."""
  acknowledgeAlert(id: ID!, user: String, source: String, note: String): RequestResult!

  """Snooze an alert until the given time."""
  snoozeAlert(id: ID!, endTime: DateTime!, user: String, source: String, note: String): RequestResult!

  """Add a note to an alert."""
  addAlertNote(id: ID!, note: String!, user: String, source: String): RequestResult!

  """Unacknowledge an alert."""
  unacknowledgeAlert(id: ID!, user: String, source: String, note: String): RequestResult!

  """Assign an alert to a user."""
  assignAlert(id: ID!, owner: AlertResponderInput!, user: String, source: String, note: String): RequestResult!

  """Escalate an alert to the next rule in the escalation policy."""
  escalateAlert(id: ID!, escalation: AlertResponderInput!, user: String, source: String, note: String): RequestResult!

  """Create a new incident."""
  createIncident(input: CreateIncidentInput!): RequestResult!

  """Close an incident."""
  closeIncident(id: ID!, note: String): RequestResult!

  """Resolve an incident."""
  resolveIncident(id: ID!, note: String): RequestResult!

  """Add a note to an incident."""
  addIncidentNote(id: ID!, note: String!): RequestResult!

  """Create a new on-call schedule."""
  createSchedule(input: ScheduleInput!): Schedule!

  """Update an existing schedule."""
  updateSchedule(id: ID!, input: ScheduleInput!): Schedule!

  """Delete a schedule."""
  deleteSchedule(id: ID!): RequestResult!

  """Create an escalation policy."""
  createEscalation(name: String!, description: String, rules: [EscalationRuleInput!]!, ownerTeam: TeamRefInput): EscalationPolicy!

  """Update an escalation policy."""
  updateEscalation(id: ID!, name: String, description: String, rules: [EscalationRuleInput!]): EscalationPolicy!

  """Delete an escalation policy."""
  deleteEscalation(id: ID!): RequestResult!

  """Create a new team."""
  createTeam(name: String!, description: String, members: [TeamMemberInput!]): Team!

  """Update a team."""
  updateTeam(id: ID!, name: String, description: String): Team!

  """Delete a team."""
  deleteTeam(id: ID!): RequestResult!

  """Add a member to a team."""
  addTeamMember(teamId: ID!, userId: ID!, role: TeamMemberRole): RequestResult!

  """Remove a member from a team."""
  removeTeamMember(teamId: ID!, userId: ID!): RequestResult!

  """Create a new user."""
  createUser(username: String!, fullName: String!, role: UserRole!, locale: String, timeZone: String, tags: [String!]): User!

  """Update an existing user."""
  updateUser(id: ID!, fullName: String, role: UserRole, locale: String, timeZone: String, tags: [String!]): User!

  """Delete a user."""
  deleteUser(id: ID!): RequestResult!

  """Create a heartbeat monitor."""
  createHeartbeat(input: CreateHeartbeatInput!): Heartbeat!

  """Update a heartbeat monitor."""
  updateHeartbeat(name: String!, input: CreateHeartbeatInput!): Heartbeat!

  """Delete a heartbeat monitor."""
  deleteHeartbeat(name: String!): RequestResult!

  """Send a ping to a heartbeat monitor."""
  pingHeartbeat(name: String!): RequestResult!

  """Enable a heartbeat monitor."""
  enableHeartbeat(name: String!): RequestResult!

  """Disable a heartbeat monitor."""
  disableHeartbeat(name: String!): RequestResult!

  """Create a maintenance window."""
  createMaintenanceWindow(input: CreateMaintenanceInput!): MaintenanceWindow!

  """Update a maintenance window."""
  updateMaintenanceWindow(id: ID!, input: CreateMaintenanceInput!): MaintenanceWindow!

  """Delete a maintenance window."""
  deleteMaintenanceWindow(id: ID!): RequestResult!

  """Cancel an active or planned maintenance window."""
  cancelMaintenanceWindow(id: ID!): RequestResult!

  """Enable an integration."""
  enableIntegration(id: ID!): RequestResult!

  """Disable an integration."""
  disableIntegration(id: ID!): RequestResult!
}

