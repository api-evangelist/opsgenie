"""Input for a team member."""
input TeamMemberInput {
  user: TeamRefInput!
  role: TeamMemberRole!
}

"""Input for an escalation rule."""
input EscalationRuleInput {
  condition: String!
  notifyType: String!
  delay: EscalationDelayInput!
  recipient: AlertResponderInput!
}

"""Input for an escalation delay."""
input EscalationDelayInput {
  timeAmount: Int!
  timeUnit: String!
}
